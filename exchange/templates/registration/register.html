<!-- templates/registration/register.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Registro | HierroEnLinea</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg p-4" style="border-radius: 15px;">
                    <h3 class="text-center fw-bold mb-4">🚀 Crear Cuenta Gratis</h3>

                        <form method="post">
                            {% csrf_token %}
                            {% if form.errors %}
                                <div class="alert alert-danger">
                                    {{ form.errors }}
                                </div>
                            {% endif %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-warning w-100 fw-bold shadow-sm">Registrarme y Empezar</button>
                        </form>
                    
                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="small text-muted">¿Ya tienes cuenta? Ingresa aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
