<!-- templates/registration/login.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Ingreso | HierroEnLinea</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg p-4">
                    <h3 class="text-center fw-bold mb-4">🔐 Acceso Seguro</h3>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar al Sistema</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'home' %}" class="small text-muted">Volver a la Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
