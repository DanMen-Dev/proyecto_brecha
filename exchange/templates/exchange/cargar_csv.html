<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px; border-radius: 15px;">
        <h3 class="fw-bold mb-4 text-center">📤 Cargar Inventario</h3>
        <p class="text-muted small">Sube tu archivo CSV con las columnas: <b>sku, nombre, precio_normal, precio_oferta, precio_normal_cashea, precio_oferta_cashea</b></p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="archivo_csv" class="form-control mb-3" accept=".csv" required>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Procesar y Actualizar</button>
        </form>
    </div>
</div>
